name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix vscode ci --no-audit --no-fund
      # Typecheck + build the VS Code extension (no root lint script exists).
      - run: npm run compile:vscode
      - run: npm test
      - run: npm run pack:dry
